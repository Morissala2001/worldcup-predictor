[project]
name = "worldcup-predictor"
version = "0.1.0"
description = "Predict international football matches from recent form and simulate a World Cup knockout bracket."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Morissala2001" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "scikit-learn>=1.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.65"]

[project.scripts]
worldcup = "worldcup.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
